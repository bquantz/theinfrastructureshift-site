<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Client-side versus server-side Outlook rule execution">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6b7785"/>
    </marker>
    <marker id="arwA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6ea8d8"/>
    </marker>
    <marker id="arwR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a85f5f"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="748" height="380" rx="14" fill="#0d1117" stroke="#21262d"/>
  <text x="30" y="42" fill="#6b7785" font-size="12.5" letter-spacing="2.5">WHERE THE RULE EXECUTES</text>

  <rect x="30" y="168" width="118" height="56" rx="8" fill="none" stroke="#30363d"/>
  <text x="89" y="201" fill="#c9d2dc" font-size="14" text-anchor="middle">New mail</text>

  <rect x="196" y="158" width="150" height="76" rx="10" fill="#0f151c" stroke="#6ea8d8"/>
  <text x="271" y="190" fill="#cfe0ef" font-size="14.5" text-anchor="middle">Exchange Online</text>
  <text x="271" y="210" fill="#6b7785" font-size="11.5" text-anchor="middle">runs in the cloud</text>

  <line x1="150" y1="196" x2="190" y2="196" stroke="#6b7785" stroke-width="1.4" marker-end="url(#arw)"/>
  <path d="M346 178 C 400 178, 400 110, 432 110" fill="none" stroke="#6ea8d8" stroke-width="1.4" marker-end="url(#arwA)"/>
  <path d="M346 214 C 400 214, 400 286, 432 286" fill="none" stroke="#a85f5f" stroke-width="1.4" marker-end="url(#arwR)"/>

  <rect x="436" y="64" width="296" height="108" rx="10" fill="#0f151c" stroke="#6ea8d8"/>
  <text x="456" y="92" fill="#6ea8d8" font-size="14.5" font-weight="600">Server-side rules</text>
  <text x="456" y="115" fill="#9aa7b4" font-size="12" font-family="ui-monospace, monospace">match: sender &#183; subject</text>
  <text x="456" y="134" fill="#9aa7b4" font-size="12" font-family="ui-monospace, monospace">do: move &#183; mark read &#183; importance</text>
  <text x="456" y="158" fill="#7fc8a0" font-size="12.5">&#10003; Always runs - no client needed</text>

  <rect x="436" y="208" width="296" height="120" rx="10" fill="#140f0f" stroke="#3a2c2c"/>
  <text x="456" y="236" fill="#cf9b9b" font-size="14.5" font-weight="600">Client-side rules</text>
  <text x="456" y="259" fill="#9c8c8c" font-size="12" font-family="ui-monospace, monospace">match: recipient address</text>
  <text x="456" y="278" fill="#9c8c8c" font-size="12" font-family="ui-monospace, monospace">do: assign category</text>
  <text x="456" y="299" fill="#8a7d7d" font-size="12">needs classic Outlook open ...</text>
  <text x="456" y="319" fill="#c47b7b" font-size="12.5">&#10007; New Outlook -> never runs</text>
</svg>
